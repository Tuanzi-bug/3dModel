services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      # 源码 bind mount：本机编辑，容器热更新
      - .:/app
      # named volume 隔离 node_modules，不污染本机
      - node_modules:/app/node_modules
      - node_modules_core:/app/packages/core/node_modules
      - node_modules_web:/app/packages/web/node_modules
      - next_web:/app/packages/web/.next
      # SQLite 数据持久化
      - sqlite_data:/app/data
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
    env_file:
      - .env
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  e2e:
    build:
      context: .
      dockerfile: Dockerfile
      target: e2e
      args:
        http_proxy: http://host.docker.internal:7890
        https_proxy: http://host.docker.internal:7890
        HTTP_PROXY: http://host.docker.internal:7890
        HTTPS_PROXY: http://host.docker.internal:7890
    volumes:
      # 共享源码和 node_modules（与 web service 相同的 volumes）
      - .:/app
      - node_modules:/app/node_modules
      - node_modules_core:/app/packages/core/node_modules
      - node_modules_web:/app/packages/web/node_modules
      - next_e2e:/app/packages/web/.next
    environment:
      - NODE_ENV=test
      - BASE_URL=http://web:3000
      - DATABASE_URL=file:/app/data/dev.db
      # Playwright 在容器内运行，不需要 DISPLAY
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy
    # 不自动启动，按需运行：docker compose run --rm e2e
    profiles:
      - e2e

volumes:
  node_modules:
  node_modules_core:
  node_modules_web:
  next_web:
  next_e2e:
  sqlite_data:
